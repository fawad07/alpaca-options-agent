name: daily-snapshot

# Once per trading day, after the US close, record a stats snapshot of the paper
# account so a detailed track record builds itself — hands-off. Reuses the same
# repo secrets as the trader. Weekends add no new info (market closed), so it runs
# weekdays only. refresh_stats.py keeps one row per date.

on:
  schedule:
    - cron: "30 21 * * 1-5"   # ~after US close: 17:30 ET (EDT) / 16:30 ET (EST), Mon–Fri
  workflow_dispatch: {}         # run manually anytime from the Actions tab

permissions:
  contents: write

concurrency:
  group: risk-gate-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Take daily stats snapshot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python research/refresh_stats.py
      - name: Commit the snapshot
        if: always()
        run: |
          git config user.name  "risk-gate-bot"
          git config user.email "actions@github.com"
          git add research/stats_snapshot.md research/stats_history.csv 2>/dev/null || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "daily snapshot: $(TZ=America/New_York date '+%Y-%m-%d ET')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 4
          done
          echo "snapshot push failed after retries" >&2; exit 1
