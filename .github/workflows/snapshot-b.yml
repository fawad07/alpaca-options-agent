name: daily-snapshot-B

# Daily track-record snapshot for account B (the combined options+crypto agent),
# mirroring account A's snapshot.yml. Crypto trades 24/7, so this runs every day.
# Writes research/stats_history-B.csv (one row/day) + stats_snapshot-B.md.
# Needs repo secrets ALPACA_B_API_KEY / ALPACA_B_SECRET_KEY.

on:
  schedule:
    - cron: "45 21 * * *"    # ~after US close, every day (crypto never closes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: risk-gate-snapshot-B
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Take daily stats snapshot (account B)
        env:
          DEPLOY_ACCOUNT: B
          ALPACA_B_API_KEY: ${{ secrets.ALPACA_B_API_KEY }}
          ALPACA_B_SECRET_KEY: ${{ secrets.ALPACA_B_SECRET_KEY }}
        run: python research/refresh_stats.py
      - name: Commit the snapshot
        if: always()
        run: |
          git config user.name  "risk-gate-bot"
          git config user.email "actions@github.com"
          git add research/stats_snapshot-B.md research/stats_history-B.csv 2>/dev/null || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "daily snapshot B: $(TZ=America/New_York date '+%Y-%m-%d ET')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 4
          done
          echo "snapshot B push failed after retries" >&2; exit 1
