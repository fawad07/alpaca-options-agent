name: risk-gate-agent

# FREE autonomous trader (public repos get unlimited GitHub Actions minutes).
# Runs the agent every 15 min during US market hours; the agent self-gates so
# off-hours/holiday runs place nothing. Add repo Secrets ALPACA_API_KEY and
# ALPACA_SECRET_KEY (Settings → Secrets and variables → Actions).

on:
  schedule:
    # Offset off the top-of-hour (:00/:15/:30/:45 are GitHub's most-congested,
    # most-skipped minutes). ~9:30–16:00 ET expressed in UTC, Mon–Fri.
    - cron: "7,22,37,52 13-20 * * 1-5"
  workflow_dispatch: {}            # lets you run it manually from the Actions tab

permissions:
  contents: write                  # so the run can commit the decision journal back

# Don't let two runs push the journal at the same time.
concurrency:
  group: risk-gate-agent
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run one market-hours-gated agent pass
        env:
          AGENT_MODE: LIVE_PAPER
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python cron_once.py
      - name: Commit the decision journal
        if: always()               # record even if the trade step errored
        run: |
          git config user.name  "risk-gate-bot"
          git config user.email "actions@github.com"
          git add activity.csv ACTIVITY.md 2>/dev/null || true
          git diff --cached --quiet && { echo "no journal change"; exit 0; }
          git commit -m "journal: run at $(TZ=America/New_York date '+%Y-%m-%d %H:%M ET')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 4
          done
          echo "journal push failed after retries" >&2; exit 1
